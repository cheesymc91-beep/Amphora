name: Build Android app

# Builds Amphora-Android.apk and attaches it to the latest release.
# Needs one repository secret: ANDROID_KEY_PASSWORD (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/build-android.yml"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing password
        env:
          PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "::error::Add a repository secret named ANDROID_KEY_PASSWORD (Settings > Secrets and variables > Actions > New repository secret), then run this workflow again."
            exit 1
          fi
          if [ ${#PW} -lt 12 ]; then echo "::error::ANDROID_KEY_PASSWORD must be at least 12 characters."; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create the signing key on the first build
        env:
          PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ ! -f mobile/amphora-release.p12 ]; then
            keytool -genkeypair -keystore mobile/amphora-release.p12 -storetype PKCS12 -storepass "$PW" -keypass "$PW" \
              -alias amphora -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=Amphora, O=Amphora"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/amphora-release.p12
            git commit -m "Add Android release signing key (password-protected) [skip ci]"
            git push
          fi
          keytool -list -keystore mobile/amphora-release.p12 -storetype PKCS12 -storepass "$PW" | tail -2

      - name: Make the Android project
        run: |
          set -euo pipefail
          cd mobile
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap add android
          cp -R res/. android/app/src/main/res/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName|applicationId" android/app/build.gradle

      - name: Build the signed APK
        env:
          PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd mobile/android
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/mobile/amphora-release.p12" \
            -Pandroid.injected.signing.store.password="$PW" \
            -Pandroid.injected.signing.key.alias=amphora \
            -Pandroid.injected.signing.key.password="$PW"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Amphora-Android.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/Amphora-Android.apk" | head -3
          ls -la "$GITHUB_WORKSPACE/Amphora-Android.apk"

      - name: Attach to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            TAG="v$(jq -r .version updates/manifest.json)"
            gh release create "$TAG" --title "Amphora" --notes "Amphora for Windows, Mac and Android." || true
          fi
          gh release upload "$TAG" Amphora-Android.apk --clobber
          echo "Uploaded Amphora-Android.apk to $TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: Amphora-Android.apk
          path: Amphora-Android.apk
